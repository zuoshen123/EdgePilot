# Project-wide Gradle settings.

# JVM arguments for the Gradle Daemon
org.gradle.jvmargs=-Xms256m -Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Use parallel execution
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true

# 禁用代理 (覆盖系统环境变量)
systemProp.http.nonProxyHosts=*
systemProp.https.nonProxyHosts=*

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true

# Non-transitive R classes
android.nonTransitiveRClass=true

# 16KB page size alignment (Android 15+)
android.experiments.art.16kb.alignment=true

# Compose
android.defaults.buildfeatures.buildconfig=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
